<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[必填] 标题 · Infographic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;500;600;700&family=Caveat:wght@400;500;600;700&family=Klee+One:wght@400;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet">
<style>
  :root{
    --aspect-ratio: 16 / 9;
    --max-width: min(100vw, 90vh * 16 / 9);
    --bg: #FDFBF7;
    --bg-rgb: 253,251,247;
    --text: #3D3228;
    --text-secondary: #8B7B6F;
    --accent-1: #E8655A;
    --accent-1-rgb: 232,101,90;
    --accent-2: #5B8A8A;
    --accent-3: #F4C542;
    --accent-4: #A8D8EA;
    --border-color: rgba(139,123,111,.2);
    --card-bg: rgba(232,101,90,.05);
    --card-radius: 12px;
    --shadow: 0 2px 12px rgba(0,0,0,.05);
    --font-headline: 'Noto Serif SC', 'PingFang SC', 'Songti SC', serif;
    --font-body: 'Noto Sans SC', 'PingFang SC', sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
    --font-display: 'Playfair Display', 'Georgia', serif;
    --font-hand: 'Caveat', 'Klee One', 'Kaiti SC', cursive;
    --title-size: clamp(28px, 3.5vw, 48px);
    --section-size: clamp(18px, 2vw, 28px);
    --body-size: clamp(13px, 1.6vw, 18px);
    --small-size: clamp(10px, 1.2vw, 13px);
    --padding: clamp(32px, 4vw, 56px);
    --gap: clamp(12px, 2vh, 20px);
  }

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;min-height:100%}
  body{
    background:#1a1a1c;display:flex;align-items:center;justify-content:center;
    padding:clamp(8px,2vh,24px);
    font-family:var(--font-body);-webkit-font-smoothing:antialiased;
  }
  .infographic{
    width:var(--max-width);aspect-ratio:var(--aspect-ratio);
    max-width:100vw;background:var(--bg);color:var(--text);
    padding:var(--padding);position:relative;overflow:hidden;
    border-radius:8px;box-shadow:var(--shadow);
  }
  .title{
    font-family:var(--font-headline);font-weight:800;
    font-size:var(--title-size);line-height:1.15;
    margin-bottom:var(--gap);
  }
  .subtitle{
    font-family:var(--font-body);font-size:var(--body-size);
    color:var(--text-secondary);margin-bottom:calc(var(--gap) * 1.5);
  }
  .section-title{
    font-family:var(--font-headline);font-weight:700;
    font-size:var(--section-size);margin-bottom:calc(var(--gap) * .6);
  }

  /* ============================================================
     ============ 布局 ============
     ============================================================ */
  .grid{display:grid;gap:var(--gap)}
  .grid-2{grid-template-columns:1fr 1fr}
  .grid-3{grid-template-columns:repeat(3,1fr)}
  .grid-4{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr)}
  .grid-auto{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}

  /* bento-grid */
  .bento{display:grid;gap:var(--gap);grid-template-columns:repeat(6,1fr)}
  .bento .cell{padding:clamp(12px,2vh,20px);border-radius:var(--card-radius);background:var(--card-bg);border:1px solid var(--border-color)}
  .bento .cell-2{grid-column:span 2}.bento .cell-3{grid-column:span 3}.bento .cell-4{grid-column:span 4}
  .bento .cell-r2{grid-row:span 2}.bento .cell-r3{grid-row:span 3}

  /* linear-progression */
  .timeline{display:flex;flex-direction:column;gap:0;padding-left:clamp(20px,2.5vw,32px);border-left:2px solid var(--accent-1)}
  .timeline .step{position:relative;padding-bottom:var(--gap)}
  .timeline .step:last-child{padding-bottom:0}
  .timeline .step::before{
    content:"";position:absolute;left:calc(-1 * clamp(20px,2.5vw,32px) - 7px);top:4px;
    width:12px;height:12px;border-radius:50%;background:var(--accent-1);
  }
  .timeline .step-label{font-family:var(--font-mono);font-size:var(--small-size);opacity:.5;margin-bottom:4px}
  .timeline .step-title{font-family:var(--font-headline);font-weight:700;font-size:var(--body-size)}

  /* binary-comparison / comparison-matrix */
  .vs{display:grid;grid-template-columns:1fr auto 1fr;gap:var(--gap);align-items:center}
  .vs .col{display:flex;flex-direction:column;gap:calc(var(--gap) * .6)}
  .vs .divider{display:flex;flex-direction:column;align-items:center;gap:8px;font-family:var(--font-display);font-weight:800;font-size:clamp(20px,3vw,36px);color:var(--accent-1)}

  /* hierarchical-layers */
  .pyramid{display:flex;flex-direction:column;gap:4px;align-items:center}
  .pyramid .layer{padding:clamp(8px,1.5vh,16px);text-align:center;background:var(--accent-1);color:#fff;font-weight:700;font-size:var(--body-size);border-radius:6px}

  /* hub-spoke */
  .hub{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);align-items:center;justify-items:center}
  .hub .center{grid-column:1/-1;padding:clamp(16px,3vh,32px);border-radius:50%;background:var(--accent-1);color:#fff;font-weight:800;font-size:var(--section-size);text-align:center;width:fit-content;min-width:clamp(100px,15vw,180px);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
  .hub .spoke{text-align:center;padding:clamp(8px,1.5vh,16px)}

  /* iceberg */
  .iceberg{display:flex;flex-direction:column;gap:var(--gap)}
  .iceberg .surface{border-bottom:3px solid var(--accent-1);padding-bottom:var(--gap)}
  .iceberg .deep{opacity:.75;padding-top:var(--gap)}

  /* funnel */
  .funnel{display:flex;flex-direction:column;align-items:center;gap:4px}
  .funnel .stage{text-align:center;padding:clamp(8px,1.5vh,16px);background:var(--accent-1);color:#fff;font-weight:600;font-size:var(--body-size);border-radius:6px}

  /* dashboard */
  .dashboard{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap)}
  .dashboard .metric{text-align:center;padding:clamp(12px,2vh,20px);border-radius:var(--card-radius);background:var(--card-bg);border:1px solid var(--border-color)}
  .dashboard .metric-num{font-family:var(--font-display);font-weight:800;font-size:clamp(28px,4.5vw,56px);line-height:1;color:var(--accent-1)}
  .dashboard .metric-label{font-family:var(--font-mono);font-size:var(--small-size);opacity:.6;margin-top:4px}

  /* dense-modules */
  .dense{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(6px,1vh,12px)}
  .dense .module{padding:clamp(8px,1.2vh,14px);border-left:2px solid var(--accent-1);background:var(--card-bg)}
  .dense .module .m-title{font-weight:700;font-size:var(--small-size)}
  .dense .module .m-desc{font-size:clamp(9px,1vw,11px);opacity:.7;margin-top:2px;line-height:1.4}

  /* periodic-table */
  .periodic{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:4px}
  .periodic .elem{padding:clamp(4px,.8vh,8px);text-align:center;border-radius:4px;background:var(--card-bg);border:1px solid var(--border-color)}
  .periodic .elem .sym{font-family:var(--font-display);font-weight:800;font-size:clamp(14px,1.8vw,22px)}
  .periodic .elem .name{font-size:clamp(8px,.9vw,10px);opacity:.6}

  /* data 块 */
  .big-stat{font-family:var(--font-display);font-weight:800;font-size:clamp(40px,6vw,80px);line-height:1;color:var(--accent-1)}
  .stat-label{font-family:var(--font-mono);font-size:var(--small-size);opacity:.5;margin-top:4px}
  .note{font-size:var(--small-size);opacity:.6;line-height:1.5;margin-top:8px}
  .tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:var(--small-size);font-family:var(--font-mono);background:rgba(var(--accent-1-rgb),.15);color:var(--accent-1);font-weight:600}
  .footer{margin-top:auto;padding-top:var(--gap);font-family:var(--font-mono);font-size:var(--small-size);opacity:.35;letter-spacing:.1em}

  @media (max-width:640px){
    :root{--max-width:100vw}
    .infographic{aspect-ratio:auto;min-height:100vh}
    .bento{grid-template-columns:1fr}.bento .cell-2,.bento .cell-3,.bento .cell-4{grid-column:span 1}
    .vs{grid-template-columns:1fr}.vs .divider{flex-direction:row}
    .hub{grid-template-columns:1fr}
    .dashboard,.dense,.grid-3{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<div class="infographic" id="infographic">
  <!-- 标题区 -->
  <h1 class="title">[必填] 信息图标题</h1>
  <p class="subtitle">[必填] 副标题或简要说明</p>

  <!-- 内容区 — 根据布局类型替换下面的 HTML -->
  <!-- 例如: bento-grid 布局 -->
  <div class="bento" style="height:calc(100% - 120px)">
    <div class="cell cell-2 cell-r2">
      <div class="big-stat">[数据]</div>
      <div class="stat-label">[标签]</div>
    </div>
    <div class="cell cell-2">
      <div class="section-title">[分区标题]</div>
      <div class="note">[内容说明]</div>
    </div>
    <div class="cell cell-2">
      <div class="section-title">[分区标题]</div>
      <div class="note">[内容说明]</div>
    </div>
    <div class="cell cell-2">
      <span class="tag">TAG</span>
      <div class="note" style="margin-top:8px">[备注]</div>
    </div>
    <div class="cell cell-2">
      <div class="section-title">[分区标题]</div>
      <div class="note">[内容说明]</div>
    </div>
  </div>

  <div class="footer">[必填] 来源/品牌</div>
</div>

</body>
</html>
